services:
  mongo:
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-build
    ports:
      - "5000:5000"
    environment:
      MONGO_URI: mongodb://mongo:27017/mern_db
      PORT: 5000
    depends_on:
      - mongo
    command: node server.js

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-build
    ports:
      - "3000:3000"
    depends_on:
      - backend
    command: npx serve -s build -l 3000

volumes:
  mongo_data:
